<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TLI Builder — Shared Build</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Narrower than index.web.html's CSP: this page never boots Pyodide/the compute engine, so
         it needs neither jsDelivr/PyPI nor 'wasm-unsafe-eval' — just the data CDN + share service. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://static.cloudflareinsights.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://tlibuilder-data.pages.dev;
        connect-src 'self'
          https://tlibuilder-data.pages.dev
          https://api.tlibuilder.com
          https://cloudflareinsights.com;
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/view.tsx"></script>
  </body>
</html>
